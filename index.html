<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divyansh404.xyz — Test Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      border: 1px solid #30363d;
      padding: 3rem 4rem;
      border-radius: 8px;
      background: #161b22;
    }
    h1 {
      color: #3fb950;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      color: #8b949e;
      font-size: 1rem;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      background: #3fb950;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>✓ Pipeline Working<span class="cursor">&nbsp;</span></h1>
    <p>GitHub → Netlify → divyansh404.xyz</p>
    <p>Real site coming soon.</p>
  </div>
</body>
</html>
